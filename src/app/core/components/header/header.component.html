<header class="h-[68px] z-10 sticky top-0 bg-gray-900">
  <div class="flex items-center justify-between h-full px-4">
    <div class="flex items-center">
      <img
        src="https://www.liderlogo.es/wp-content/uploads/2022/12/pasted-image-0-6-1024x576.png"
        alt="Netflix"
        width="110"
        class="mr-8"
      />
      <nav>
        <ul class="flex gap-6">
          @for (item of navList; track item) {
            <li class="text-white hover:text-gray-300 cursor-pointer">
              {{ item }}
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="flex items-center gap-4">
      <div class="flex items-center text-white">
        <span>Welcome Fernando</span>
        <img
          [src]="userImg"
          alt="Profile"
          class="w-8 h-8 rounded-full object-cover ml-2"
        />
      </div>

      <div class="h-6 w-[1px] bg-gray-300"></div>

      <button
        (click)="logout()"
        class="text-white hover:text-gray-300"
      >
        Sign Out
      </button>
    </div>
  </div>
</header>
