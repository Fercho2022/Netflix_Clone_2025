<header class="h-[68px] z-10 sticky top-0 bg-gray-900">
  <div class="flex items-center justify-between h-full px-2 sm:px-4">
    <div class="flex items-center">
      <img
        src="https://www.liderlogo.es/wp-content/uploads/2022/12/pasted-image-0-6-1024x576.png"
        alt="Netflix"
        class="w-20 sm:w-[110px] mr-2 sm:mr-8"
      />
      <nav class="hidden sm:block">
        <ul class="flex gap-2 sm:gap-6">
          @for (item of navList; track item) {
          <li
            (click)="navigateTo(item)"
            class="text-white hover:text-gray-300 cursor-pointer text-sm sm:text-base"
          >
            {{ item }}
          </li>
          }
        </ul>
      </nav>
    </div>

    <!-- Segunda sección con usuario y botón de cerrar sesión (rebalanceada) -->
  <div class="flex items-center space-x-4">
    <!-- Información del usuario -->
    <div class="flex items-center text-white">
      <span class="hidden sm:inline mr-1">Bienvenido</span>
      <span class="text-sm sm:text-base">{{ userName }}</span>
      <img
        [src]="userImg"
        alt="Profile"
        class="w-6 h-6 sm:w-8 sm:h-8 rounded-full object-cover ml-2"
      />
    </div>

    <!-- Separador vertical con espaciado uniforme -->
    <div class="h-5 w-[1px] bg-gray-300 mx-1 hidden sm:block"></div>

    <!-- Botón de cerrar sesión -->
    <button
      (click)="logout()"
      class="text-white hover:text-gray-300 text-sm sm:text-base"
    >
      Cerrar sesión
    </button>
  </div>
</div>

</header>
