<header class="h-[68px] z-10 sticky top-0 bg-gray-900">
  <div class="flex items-center justify-between h-full px-2 sm:px-4">
    <div class="flex items-center">
      <img
        src="https://www.liderlogo.es/wp-content/uploads/2022/12/pasted-image-0-6-1024x576.png"
        alt="Netflix"
        class="w-20 sm:w-[110px] mr-2 sm:mr-8"
      />
      <nav class="hidden sm:block">
        <ul class="flex gap-2 sm:gap-6">
          @for (item of navList; track item) {
            <li class="text-white hover:text-gray-300 cursor-pointer text-sm sm:text-base">
              {{ item }}
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="flex items-center gap-2 sm:gap-4">
      <div class="flex items-center text-white">
        <span class="hidden sm:inline">Welcome</span>
        <span class="text-sm sm:text-base ml-1">Fernando</span>
        <img
          [src]="userImg"
          alt="Profile"
          class="w-6 h-6 sm:w-8 sm:h-8 rounded-full object-cover ml-2"
        />
      </div>

      <div class="h-6 w-[1px] bg-gray-300 hidden sm:block"></div>

      <button
        (click)="logout()"
        class="text-white hover:text-gray-300 text-sm sm:text-base"
      >
        Sign Out
      </button>
    </div>
  </div>
</header>
