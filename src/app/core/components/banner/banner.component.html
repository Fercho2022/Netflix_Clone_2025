<div class="relative w-full h-[50vh] sm:h-[70vh] md:h-screen">
  <!-- Video de fondo -->
  <iframe
    #youtubePlayer
    class="absolute top-0 left-0 w-full h-full object-cover pointer-events-none"
    [src]="videoUrl"
    frameborder="0"
    (error)="handleIframeError($event)"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>

  <!-- Overlay para el contenido -->
  <div class="absolute inset-0 bg-gradient-to-r from-black to-transparent">
    <div class="flex flex-col justify-center h-full px-4 sm:px-8 md:px-12 w-full sm:w-3/4 md:w-1/2">
      <!-- Título -->
      <h1 class="text-3xl sm:text-4xl md:text-6xl font-bold text-white mb-2 sm:mb-4">
        {{bannerTitle}}
      </h1>

      <!-- Descripción -->
      <p class="text-sm sm:text-base md:text-lg text-white mb-4 sm:mb-6 md:mb-8 w-full sm:w-4/5 line-clamp-3 sm:line-clamp-none">
        {{bannerOverview}}
      </p>

      <!-- Botones -->
      <div class="flex gap-2 sm:gap-4">
        <button
          (click)="toogleVideo()"
          class="flex items-center gap-1 sm:gap-2 px-4 sm:px-6 md:px-8 py-2 sm:py-3 bg-gray-300 hover:bg-gray-400 rounded-md text-black font-semibold text-sm sm:text-base"
        >
          @if(!isPlaying){
            <!-- Icono de Play -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 sm:h-6 sm:w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Play
          } @else {
            <!-- Icono de Pause -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 sm:h-6 sm:w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Pause
          }
        </button>
        <button
          class="px-4 sm:px-6 md:px-8 py-2 sm:py-3 bg-gray-800 hover:bg-gray-700 rounded-md text-white font-semibold text-sm sm:text-base"
        >
          More Info
        </button>
      </div>
    </div>
  </div>
</div>
